---
- name: MongoDB role main orchestration
  block:
    - name: Detect host's primary MongoDB group
      ansible.builtin.set_fact:
        mongodb_main_group: >-
          {{ group_names
             | select('match', (group_names | map('regex_replace', '[0-9]*$', '') | list
                                | intersect([mongodb_standalone_host_group,
                                             mongodb_replication_host_group,
                                             mongodb_sharded_host_group,
                                             mongodb_config_host_group,
                                             mongos_host_group])
                              )[0] | default('') )
             | list | first | default('') }}

    - name: Skip host if not in any MongoDB group
      ansible.builtin.meta: end_host
      when: mongodb_main_group | length == 0

    - name: Build per-replicaset master map (run_once, excludes arbiters)
      ansible.builtin.set_fact:
        mongodb_replicaset_masters: >-
          {{
            dict(
              mongodb_replicaset_groups
              | zip(
                  mongodb_replicaset_groups
                  | map('extract', groups)
                  | map('sort')
                  | map('reject', 'in', _arbiter_hosts)
                  | map('list')
                  | map('first')
                )
            )
          }}
      vars:
        _arbiter_hosts: >-
          {{ groups['all']
             | map('extract', hostvars)
             | selectattr('mongodb_arbiter', 'defined')
             | selectattr('mongodb_arbiter', 'eq', True)
             | map(attribute='inventory_hostname')
             | list }}
      run_once: true
      delegate_to: localhost

    - name: Validate (gatekeeper)
      ansible.builtin.include_tasks: validate.yml
      tags: [validate]

    - name: Install requirements (pymongo, python3.9 if needed)
      ansible.builtin.include_tasks: install.requirements.yml
      tags: [install]

    - name: Install MongoDB via community.mongodb.mongodb_repository
      ansible.builtin.include_tasks: install.yml
      tags: [install]

    - name: Probe replicaset bootstrap state (sets fact before configure.yml)
      ansible.builtin.include_tasks: probe_replicaset_state.yml
      when:
        - mongodb_replication_replSetName | length > 0
        - mongodb_main_group != mongos_host_group
      tags: [configure, replicaset]

    - name: Configure mongod/mongos/configsvr (delegate to community.mongodb)
      ansible.builtin.include_tasks: configure.yml
      tags: [configure]

    - name: Bootstrap replicaset + initial users (Phase 1 + 2 per spec §5.4)
      ansible.builtin.include_tasks: replicaset.yml
      when:
        - mongodb_replication_replSetName | length > 0
        - mongodb_main_group != mongos_host_group
      tags: [replicaset]

    - name: Sharding (preserve-not-regress)
      ansible.builtin.include_tasks: sharding.yml
      when: mongodb_main_group == mongos_host_group
      tags: [sharding]

    - name: Create application users
      ansible.builtin.include_tasks: create_users.yml
      when:
        - mongodb_main_group != mongos_host_group
        - inventory_hostname == (mongodb_replicaset_masters[mongodb_main_group] | default(''))
      tags: [users]

    - name: Additional commands (opt-in via tag)
      ansible.builtin.include_tasks: additional_commands.yml
      tags: [never, commands]

    - name: Disable Transparent Huge Pages (if requested + not in unprivileged docker)
      ansible.builtin.include_tasks: disable_transparent_hugepages.yml
      when: mongodb_disable_transparent_hugepages | bool
      tags: [thp]

    - name: Install mongodb-exporter
      ansible.builtin.include_tasks: mongodb-exporter.yaml
      when: mongodb_exporter_enabled | bool
      tags: [exporter]
