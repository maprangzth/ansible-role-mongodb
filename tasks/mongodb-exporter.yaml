---
# NOTE: The exporter MongoDB user is created in tasks/create_users.yml
# (Phase 3 — after auth bootstrap). This file installs only the binary +
# systemd unit.

- name: Check Installed MongoDB Prometheus Exporter Version
  ansible.builtin.command: "{{ mongodb_exporter_path }} --version"
  failed_when: false
  changed_when: false
  register: mongodb_exporter_exists_version
  tags: [mongodb, mongos, mongodb-exporter]

- name: Install MongoDB Prometheus Exporter  # noqa: block-has-explicit-name
  when:
    - mongodb_exporter_version not in mongodb_exporter_exists_version.stdout | default('')
  tags: [mongodb, mongos, mongodb-exporter]
  block:
    - name: Create MongoDB Prometheus Exporter Linux User '{{ mongodb_exporter_user }}'
      ansible.builtin.user:
        name: "{{ mongodb_exporter_user }}"
        comment: "MongoDB Prometheus Exporter User (Ansible Managed)"
        create_home: false
        shell: "/usr/sbin/nologin"
        system: true
      tags: [mongodb, mongos, mongodb-exporter]

    - name: Create Temporary MongoDB Prometheus Exporter Directory
      ansible.builtin.file:
        path: "{{ mongodb_exporter_temp_dir }}"
        state: directory
        mode: "0750"
      tags: [mongodb, mongos, mongodb-exporter]

    # https://github.com/percona/mongodb_exporter/releases/download/v0.51.0/mongodb_exporter-0.51.0.linux-amd64.tar.gz
    - name: Download mongodb-exporter (pinned + checksum) version {{ mongodb_exporter_version }}
      ansible.builtin.get_url:
        url: "{{ mongodb_exporter_link }}"
        dest: "{{ mongodb_exporter_temp_dir }}/mongodb-exporter.tar.gz"
        checksum: "sha256:{{ mongodb_exporter_sha256[mongodb_exporter_arch] }}"
        mode: "0640"
      tags: [mongodb, mongos, mongodb-exporter]

    - name: Extract MongoDB Prometheus Exporter binary version {{ mongodb_exporter_version }}
      ansible.builtin.unarchive:
        src: "{{ mongodb_exporter_temp_dir }}/mongodb-exporter.tar.gz"
        dest: "{{ mongodb_exporter_temp_dir }}"
        remote_src: true
        mode: "0755"
        extra_opts: "--strip-components=1"
      tags: [mongodb, mongos, mongodb-exporter]

    - name: Assert MongoDB Prometheus Exporter Binary Exists After Extract
      ansible.builtin.stat:
        path: "{{ mongodb_exporter_temp_dir }}/mongodb_exporter"
      register: download_result_exporter
      tags: [mongodb, mongos, mongodb-exporter]

    - name: Ensure MongoDB Prometheus Exporter binary exists after extraction
      ansible.builtin.assert:
        that:
          - download_result_exporter.stat.exists
        fail_msg: "MongoDB Prometheus Exporter {{ mongodb_exporter_version }} binary not found after extraction!"
        quiet: true
      tags: [mongodb, mongos, mongodb-exporter]

    - name: Copy MongoDB Prometheus Exporter binary to {{ mongodb_exporter_path }}
      ansible.builtin.copy:
        src: "{{ mongodb_exporter_temp_dir }}/mongodb_exporter"
        dest: "{{ mongodb_exporter_path }}"
        mode: "0755"
        owner: "{{ mongodb_exporter_user }}"
        group: "{{ mongodb_exporter_group }}"
        remote_src: true
      notify:
        - Restart MongoDB-Exporter
      when: download_result_exporter.stat.exists
      tags: [mongodb, mongos, mongodb-exporter]

    - name: Delete Temporary MongoDB Prometheus Exporter Download Directory
      ansible.builtin.file:
        path: "{{ mongodb_exporter_temp_dir }}"
        state: absent
      tags: [mongodb, mongos, mongodb-exporter]

- name: Create MongoDB Prometheus Exporter Service File
  ansible.builtin.template:
    src: mongodb-exporter.service.j2
    dest: /etc/systemd/system/mongodb-exporter.service
    mode: "0644"
    backup: true
  notify:
    - Systemd Daemon Reload
    - Restart MongoDB-Exporter
    - Wait When MongoDB-Exporter is Started
  tags: [mongodb, mongos, mongodb-exporter]
