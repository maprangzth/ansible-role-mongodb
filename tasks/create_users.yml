---
# Phase 3 — additional users (after Phase 1+2 in replicaset.yml; runs auth'd)

- name: Create application users
  community.mongodb.mongodb_user:
    login_host: 127.0.0.1
    login_port: "{{ mongodb_net_port }}"
    replica_set: "{{ mongodb_replication_replSetName }}"
    login_user: "{{ mongodb_root_admin_name }}"
    login_password: "{{ mongodb_root_admin_password }}"
    login_database: "{{ mongodb_login_database }}"
    database: "{{ item.database | default(item.name) }}"
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    roles: "{{ item.roles }}"
    state: "{{ item.state | default('present') }}"
    update_password: "{{ 'always' if (item.update_password | default(mongodb_users_update_password)) else 'on_create' }}"
  no_log: true
  loop: "{{ mongodb_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: mongodb_users | length > 0

- name: Create oplog users
  community.mongodb.mongodb_user:
    login_host: 127.0.0.1
    login_port: "{{ mongodb_net_port }}"
    replica_set: "{{ mongodb_replication_replSetName }}"
    login_user: "{{ mongodb_root_admin_name }}"
    login_password: "{{ mongodb_root_admin_password }}"
    login_database: "{{ mongodb_login_database }}"
    database: "{{ mongodb_login_database }}"
    name: "{{ item.name }}"
    password: "{{ item.password }}"
    roles:
      - db: "local"
        role: "read"
    state: "{{ item.state | default('present') }}"
  no_log: true
  loop: "{{ mongodb_oplog_users }}"
  loop_control:
    label: "{{ item.name }}"
  when: mongodb_oplog_users | length > 0

- name: Create custom roles
  community.mongodb.mongodb_role:
    login_host: 127.0.0.1
    login_port: "{{ mongodb_net_port }}"
    replica_set: "{{ mongodb_replication_replSetName }}"
    login_user: "{{ mongodb_root_admin_name }}"
    login_password: "{{ mongodb_root_admin_password }}"
    login_database: "{{ mongodb_login_database }}"
    database: "{{ item.database }}"
    name: "{{ item.name }}"
    roles: "{{ item.roles | default([]) }}"
    privileges: "{{ item.privileges | default([]) }}"
    state: "{{ item.state | default('present') }}"
  no_log: true
  loop: "{{ mongodb_custom_roles }}"
  loop_control:
    label: "{{ item.name }}"
  when: mongodb_custom_roles | length > 0

- name: Create exporter user
  community.mongodb.mongodb_user:
    login_host: 127.0.0.1
    login_port: "{{ mongodb_net_port }}"
    replica_set: "{{ mongodb_replication_replSetName }}"
    login_user: "{{ mongodb_root_admin_name }}"
    login_password: "{{ mongodb_root_admin_password }}"
    login_database: "{{ mongodb_login_database }}"
    database: "{{ mongodb_login_database }}"
    name: "{{ mongodb_exporter_name }}"
    password: "{{ mongodb_exporter_password }}"
    roles:
      - db: "admin"
        role: "clusterMonitor"
      - db: "local"
        role: "read"
    state: present
    update_password: on_create
  no_log: true
  when: mongodb_exporter_enabled | bool
