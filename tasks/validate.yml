---
# === Architecture preflight (fail closed) ===
- name: Assert supported CPU architecture
  ansible.builtin.assert:
    that:
      - ansible_architecture in mongodb_supported_architectures
    fail_msg: >-
      Unsupported CPU architecture: {{ ansible_architecture }}.
      Allowed: {{ mongodb_supported_architectures }}.
      This role supports x86_64 (amd64) and aarch64 (arm64) only.

# === Detect installed MongoDB major version ===
- name: Detect installed MongoDB
  ansible.builtin.command: mongod --version
  register: mongod_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Parse installed major version (robust)
  ansible.builtin.set_fact:
    mongodb_installed_major: >-
      {{ ((mongod_installed.stdout | default('') | regex_search('db version v(\d+\.\d+)', '\\1') | default([])) + [''])
         | first }}
  when: mongod_installed.rc | default(1) == 0

- name: Block accidental major-version upgrade
  ansible.builtin.fail:
    msg: |
      Installed MongoDB {{ mongodb_installed_major }} differs from target {{ mongodb_major_version }}.
      In-place major upgrades require manual step-wise procedure (see docs/MIGRATION-v2.md).
      Set mongodb_allow_major_upgrade: true ONLY after completing the manual upgrade procedure.
  when:
    - mongodb_installed_major | default('') | length > 0
    - mongodb_installed_major != mongodb_major_version
    - not (mongodb_allow_major_upgrade | default(false) | bool)

# === Removed v1 vars (clean-break enforcement) ===
- name: Reject removed v1 variables (clean-break enforcement)
  ansible.builtin.fail:
    msg: >-
      Variable '{{ item }}' was removed in v2.0.0.
      See docs/MIGRATION-v2.md for the v2.0 replacement.
      Remove this variable from your inventory/playbook before running this role.
  loop: "{{ _removed_v1_vars }}"
  loop_control:
    label: "{{ item }}"
  vars:
    _removed_v1_vars:
      # SSL legacy block — replaced by mongodb_net_tls_* flat vars
      - mongodb_net_ssl_enabled
      - mongodb_net_ssl_PEMKeyFile_path
      - mongodb_net_ssl_CAFile_path
      - mongodb_net_ssl_CRLFile_path
      - mongodb_net_ssl_clusterFile_path
      - mongodb_net_ssl_clusterCAFile_path
      # TLS v1 nested schema — replaced by flat mongodb_net_tls_* vars
      - mongodb_net_tls_config
      - mongodb_net_tls_certificateKeyFile_path
      - mongodb_net_tls_CAFile_path
      - mongodb_net_tls_CRLFile_path
      - mongodb_net_tls_clusterFile_path
      - mongodb_net_tls_clusterCAFile_path
      # MMS agent — MongoDB Ops Manager replaced MMS; agent no longer distributed
      - mongodb_mms_agent_pkg
      - mongodb_mms_group_id
      - mongodb_mms_api_key
      - mongodb_mms_base_url
      # Free cloud monitoring — deprecated upstream in MongoDB 6.0
      - mongodb_cloud_enabled
      - mongodb_cloud_monitoring_free_state
      # mmapv1 storage — engine removed in MongoDB 4.2; v2.0 supports 6.0+
      - mongodb_storage_quota_enforced
      - mongodb_storage_quota_maxfiles
      - mongodb_storage_smallfiles
      - mongodb_storage_prealloc
      # Architecture conflation — split into mongodb_apt_arch, mongodb_rpm_arch, mongodb_exporter_arch
      - bin_arch
      # Dead code — MongoDB HTTP interface removed in 3.6
      - mongodb_net_http_enabled
  when: item in vars

- name: Reject legacy SSL config dict (dict-variant guard)
  ansible.builtin.fail:
    msg: >-
      'mongodb_net_ssl_config' was removed in v2.0.0 (nested dict variant).
      Use the flat mongodb_net_tls_* vars instead. See docs/MIGRATION-v2.md §6.3.
  when:
    - mongodb_net_ssl_config is defined
    - mongodb_net_ssl_config | length > 0

# === MongoDB major version validation ===
- name: Assert MongoDB major version is supported
  ansible.builtin.assert:
    that:
      - mongodb_major_version in ['6.0', '7.0', '8.0']
    fail_msg: >-
      Unsupported MongoDB major version: {{ mongodb_major_version }}.
      Allowed values: 6.0 (deprecated/EOL, requires opt-in), 7.0, 8.0.
      Update mongodb_version in your inventory.

- name: Require explicit opt-in for deprecated MongoDB 6.0
  ansible.builtin.fail:
    msg: |
      MongoDB 6.0 reached end of life on 2025-07-31 and is no longer supported upstream.
      To proceed anyway, set mongodb_allow_eol_version: true in your inventory.
      Strongly recommended: upgrade to MongoDB 7.0 or 8.0.
  when:
    - mongodb_major_version == "6.0"
    - not (mongodb_allow_eol_version | default(false) | bool)

- name: Warn when using EOL MongoDB 6.0
  ansible.builtin.debug:
    msg: >-
      WARNING: MongoDB 6.0 is end-of-life. Plan migration to 7.0 or 8.0.
  when: mongodb_major_version == "6.0"

# === Support matrix (MongoDB x OS x arch) ===
- name: Assert (MongoDB version, OS, architecture) combination is supported
  ansible.builtin.assert:
    that:
      - mongodb_major_version in mongodb_support_matrix
      - ansible_distribution in mongodb_support_matrix[mongodb_major_version]
      - ansible_distribution_major_version in mongodb_support_matrix[mongodb_major_version][ansible_distribution]
      - ansible_architecture in mongodb_support_matrix[mongodb_major_version][ansible_distribution][ansible_distribution_major_version]
    fail_msg: >-
      Unsupported combination: MongoDB {{ mongodb_major_version }} on
      {{ ansible_distribution }} {{ ansible_distribution_major_version }}
      ({{ ansible_architecture }}).
      See docs/SUPPORT-MATRIX.md for the full supported combinations.

# === PyMongo version check ===
# Note: pymongo is installed by install.requirements.yml AFTER validate.yml runs.
# This check is a runtime guard — it skips silently when pymongo isn't yet installed
# (first-run path), and asserts >=4.6 on subsequent runs (re-apply path).
- name: Detect pymongo presence
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('/usr/bin/python3') }} -c "import pymongo"
  register: pymongo_present
  changed_when: false
  failed_when: false
  when: inventory_hostname in (groups[mongodb_replication_host_group] | default([]))

- name: Assert pymongo >= 4.6 (when present)
  ansible.builtin.command: >
    {{ ansible_python_interpreter | default('/usr/bin/python3') }} -c
    "from packaging.version import Version; import pymongo;
    assert Version(pymongo.__version__) >= Version('4.6'),
    'pymongo ' + pymongo.__version__ + ' < 4.6'"
  changed_when: false
  when:
    - inventory_hostname in (groups[mongodb_replication_host_group] | default([]))
    - pymongo_present.rc | default(1) == 0

# === x86-64-v2 microarchitecture check (MongoDB 7.0+ on x86_64) ===
- name: Locate ld.so cross-platform
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /lib64/ld-linux-x86-64.so.2
    - /lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
  register: ldso_probe
  when:
    - ansible_architecture == "x86_64"
    - mongodb_major_version in ['7.0', '8.0']

- name: Set ld.so path fact
  ansible.builtin.set_fact:
    _ldso_path: >-
      {{ (ldso_probe.results
          | selectattr('stat.exists', 'equalto', true)
          | map(attribute='item')
          | list + [''])[0] }}
  when:
    - ansible_architecture == "x86_64"
    - mongodb_major_version in ['7.0', '8.0']

- name: Query ld.so for supported microarchitectures
  ansible.builtin.command: "{{ _ldso_path }} --help"
  register: ld_help
  changed_when: false
  failed_when: false
  when:
    - ansible_architecture == "x86_64"
    - mongodb_major_version in ['7.0', '8.0']
    - _ldso_path | default('') | length > 0

- name: Assert x86-64-v2 microarchitecture support (MongoDB 7.0+ requires x86-64-v2)
  ansible.builtin.assert:
    that:
      - _ldso_path | default('') | length > 0
      - ld_help.rc | default(1) == 0
      - "'x86-64-v2 (supported' in (ld_help.stdout | default(''))"
    fail_msg: >-
      MongoDB {{ mongodb_major_version }} requires x86-64-v2 microarchitecture.
      One of: (1) CPU does not support x86-64-v2 SSE4.2/POPCNT instructions,
      (2) ld.so could not be located (found: '{{ _ldso_path | default("not found") }}'),
      (3) ld.so --help output format changed unexpectedly.
      Remediation: upgrade the host hardware to x86-64-v2 or later,
      or use an aarch64 host where this check does not apply.
  when:
    - ansible_architecture == "x86_64"
    - mongodb_major_version in ['7.0', '8.0']

# === TLS preflight ===
- name: Assert TLS required vars are set when TLS is enabled
  ansible.builtin.assert:
    that:
      - mongodb_net_tls_certificateKeyFile | length > 0
      - mongodb_net_tls_CAFile | length > 0
      - mongodb_net_tls_mode in ['allowTLS', 'preferTLS', 'requireTLS']
    fail_msg: >-
      mongodb_net_tls_enabled=true requires all of the following to be set:
      mongodb_net_tls_certificateKeyFile (path to PEM key file),
      mongodb_net_tls_CAFile (path to CA file),
      mongodb_net_tls_mode (one of: allowTLS, preferTLS, requireTLS).
  when: mongodb_net_tls_enabled | bool

- name: Assert TLS certificate files exist on target host
  ansible.builtin.stat:
    path: "{{ item }}"
  register: tls_files
  failed_when: not tls_files.stat.exists
  loop: >-
    {{ [mongodb_net_tls_certificateKeyFile, mongodb_net_tls_CAFile]
       + ([mongodb_net_tls_CRLFile] if mongodb_net_tls_CRLFile | length > 0 else [])
       + ([mongodb_net_tls_clusterFile] if mongodb_net_tls_clusterFile | length > 0 else [])
       + ([mongodb_net_tls_clusterCAFile] if mongodb_net_tls_clusterCAFile | length > 0 else []) }}
  when: mongodb_net_tls_enabled | bool

# === Rolling restart preflight warning ===
- name: Warn if multi-node group applied without serial directive
  ansible.builtin.debug:
    msg: >-
      WARNING: This role is being applied to a multi-node group
      ({{ groups[mongodb_main_group] | default([]) | length }} members in '{{ mongodb_main_group }}')
      without serial: 1 in your playbook.
      Auth bootstrap requires a controlled rolling restart — running without serial
      may cause authentication failures during convergence.
      Set mongodb_allow_non_serial_apply: true to suppress this warning
      if you have handled the rolling restart at the playbook level.
  when:
    - groups[mongodb_main_group] | default([]) | length > 1
    - not (mongodb_allow_non_serial_apply | default(false) | bool)

# === Required password vars ===
- name: Assert required admin passwords are set (non-empty)
  ansible.builtin.assert:
    that:
      - mongodb_root_admin_password | length > 0
      - mongodb_user_admin_password | length > 0
    fail_msg: >-
      Both mongodb_root_admin_password and mongodb_user_admin_password must be
      set to non-empty values. Use ansible-vault to store them securely.
      Example: ansible-vault encrypt_string 'mypassword' --name 'mongodb_root_admin_password'
  when: mongodb_main_group | default('') != mongos_host_group

# === Keyfile content required for replicaset ===
- name: Assert keyfile content is set for replicaset member
  ansible.builtin.assert:
    that:
      - mongodb_security_keyfile_content | length > 0
    fail_msg: >-
      mongodb_security_keyfile_content is required when mongodb_replication_replSetName
      is set (replicaset or sharded cluster member).
      Generate a secure keyfile: openssl rand -base64 756
      Store the value in ansible-vault.
  when:
    - mongodb_replication_replSetName | default('') | length > 0
    - mongodb_main_group | default('') != mongos_host_group
