---
galaxy_info:
  role_name: mongodb
  namespace: maprangzth
  author: maprangzth (forked from Vitaly Kargin / superset1)
  description: |
    Deploy and manage MongoDB 6.0/7.0/8.0 (replicaset + sharding + auth + TLS + exporter)
    on RHEL/Rocky 9, Debian 12, Ubuntu 22.04/24.04. amd64 + arm64.
    Forked from superset1/ansible-role-mongodb (unmaintained since 2023) at v1.6.5.
  license: MIT
  min_ansible_version: "2.15"
  platforms:
    - name: EL
      versions: ["8", "9"]
    - name: Debian
      versions: ["bookworm"]
    - name: Ubuntu
      versions: ["jammy", "noble"]
  galaxy_tags:
    - mongodb
    - database
    - nosql
    - cluster
    - sharding
    - replicaset
    - tls
    - prometheus

dependencies: []

collections:
  - community.mongodb
