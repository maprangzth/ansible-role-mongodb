---
# Opt-in tasks invoked only when operator passes `--tags commands`.
# These are operational utilities (oplog resize, etc.), not idempotent
# configuration tasks. Default tag `never` keeps them off the normal run.

- name: Resize Oplog to specified megabytes
  community.mongodb.mongodb_oplog:
    login_user: "{{ mongodb_root_admin_name }}"
    login_password: "{{ mongodb_root_admin_password }}"
    login_host: 127.0.0.1
    login_port: "{{ mongodb_net_port }}"
    login_database: "{{ mongodb_login_database }}"
    tls: "{{ mongodb_net_tls_enabled | bool }}"
    tlsCertificateKeyFile: >-
      {{ mongodb_net_tls_certificateKeyFile
         if (mongodb_net_tls_enabled and (mongodb_net_tls_certificateKeyFile | length > 0))
         else omit }}
    tlsCAFile: >-
      {{ mongodb_net_tls_CAFile
         if (mongodb_net_tls_enabled and (mongodb_net_tls_CAFile | length > 0))
         else omit }}
    tlsAllowInvalidCertificates: >-
      {{ 'CERT_OPTIONAL'
         if (mongodb_net_tls_enabled and (mongodb_net_tls_allowInvalidCertificates | bool))
         else ('CERT_REQUIRED' if mongodb_net_tls_enabled else 'CERT_NONE') }}
    oplog_size_mb: "{{ mongodb_replication_oplogSizeMB }}"
  no_log: true
  when:
    - mongodb_replication_replSetName | length > 0
    - mongodb_replication_oplogresize | default(false) | bool
