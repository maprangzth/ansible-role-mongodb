---
name: molecule
on:
  push:
    branches: [main, refactor/**]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core==2.15.* ansible-lint yamllint
      - run: ansible-lint
      - run: yamllint .

  molecule-pr:
    needs: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - debian12
          - rhel9
          - ubuntu2204
          - ubuntu2404
          - ubuntu2204-mongo70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core==2.15.* molecule "molecule-plugins[docker]" docker pymongo packaging
      - run: ansible-galaxy collection install -r requirements.yml
      - run: molecule test -s ${{ matrix.scenario }}
        env:
          MOLECULE_NO_LOG: "false"

  molecule-nightly:
    needs: lint
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - debian12-mongo60
          - rhel8
          - arm64-debian12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Setup QEMU for arm64
        if: matrix.scenario == 'arm64-debian12'
        uses: docker/setup-qemu-action@v3
      - run: pip install ansible-core==2.15.* molecule "molecule-plugins[docker]" docker pymongo packaging
      - run: ansible-galaxy collection install -r requirements.yml
      - run: molecule test -s ${{ matrix.scenario }}
