---
- name: Prepare nodes
  hosts: all
  become: true
  tasks:
    - name: Install python3.9 + base packages (RHEL 8 default python is 3.6, incompatible with pymongo 4.6+)
      ansible.builtin.dnf:
        name:
          - python3.9
          - python39-pip
          - gnupg2
          - curl
          - ca-certificates
        state: present

    - name: Override pip3 → pip3.9 (community.mongodb uses pip3 to install pymongo; 3.6 pip cannot find pymongo>=4.6)
      ansible.builtin.file:
        src: /usr/bin/pip3.9
        dest: /usr/bin/pip3
        state: link
        force: true
