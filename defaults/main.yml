---
# === Core ===
mongodb_version: "8.0"
mongodb_major_version: "{{ mongodb_version[0:3] }}"
mongodb_allow_major_upgrade: false        # opt-in for in-place major upgrade (must be done manually step-wise)
mongodb_allow_eol_version: false          # required true to use MongoDB 6.0 (deprecated tier)
mongodb_allow_non_serial_apply: false     # bypass rolling-restart preflight warning

# === User / group ===
mongodb_user: "{{ 'mongod' if ansible_os_family == 'RedHat' else 'mongodb' }}"
mongodb_group: "{{ mongodb_user }}"

# === Network ===
mongodb_net_bindIp: "0.0.0.0"
mongodb_net_bind_ip_all: false
mongodb_net_ipv6: false
mongodb_net_maxConns: 65536
mongodb_net_port: 27017

# === TLS (replaces v1 SSL block) ===
mongodb_net_tls_enabled: false
mongodb_net_tls_mode: ""                  # disabled|allowTLS|preferTLS|requireTLS
mongodb_net_tls_certificateKeyFile: ""
mongodb_net_tls_CAFile: ""
mongodb_net_tls_CRLFile: ""
mongodb_net_tls_clusterFile: ""
mongodb_net_tls_clusterCAFile: ""
mongodb_net_tls_allowConnectionsWithoutCertificates: false
mongodb_net_tls_allowInvalidCertificates: false
mongodb_net_tls_allowInvalidHostnames: false
mongodb_net_tls_FIPSMode: false
mongodb_net_tls_disabledProtocols: ""
mongodb_net_tls_logVersions: ""

# === Process / systemd ===
mongodb_processManagement_fork: "{{ ansible_os_family == 'RedHat' }}"
mongodb_systemd_unit_limit_nofile: 64000
mongodb_systemd_unit_limit_nproc: 64000
mongodb_disable_transparent_hugepages: false
mongodb_use_numa: false

# === Security ===
mongodb_security_authorization_enabled: true
mongodb_security_javascript_enabled: false
mongodb_security_keyfile_path: /etc/mongodb-keyfile
mongodb_security_keyfile_content: ""

# === Storage ===
mongodb_storage_dbPath: /var/lib/mongodb
mongodb_storage_engine: wiredTiger
mongodb_storage_wiredTiger_cacheSizeGB: ""
mongodb_storage_wiredTiger_directoryForIndexes: false
mongodb_storage_journal_enabled: true

# === systemLog ===
mongodb_systemLog_destination: file
mongodb_systemLog_logAppend: true
mongodb_systemLog_path: /var/log/mongodb/mongod.log

# === Operation profiling ===
mongodb_operationProfiling_slowOpThresholdMs: 100
mongodb_operationProfiling_mode: "off"

# === Replication ===
mongodb_replication_replSetName: ""
mongodb_replication_oplogSizeMB: 4096
mongodb_replication_reconfigure: false

# === Sharding (preserve from v1 — modernization in sub-project 2) ===
mongodb_sharding_state: present
mongodb_sharding_clusterRole: ""           # shardsvr | configsvr | ""
mongodb_sharded_databases: []

# === Inventory groups ===
mongodb_standalone_host_group: "mongo_standalone"
mongodb_replication_host_group: "mongo_cluster"
mongodb_sharded_host_group: "mongo_shard_"
mongodb_config_host_group: "mongocfg_servers"
mongos_host_group: "mongos_servers"

# === Mongos ===
mongos_user: "{{ 'mongos' if ansible_os_family == 'RedHat' else 'mongodb' }}"
mongos_group: "{{ mongos_user }}"
mongos_net_port: 27017
mongos_net_bindIp: "0.0.0.0"
mongos_security_keyfile_path: "{{ mongodb_security_keyfile_path }}"
mongos_security_keyfile_content: "{{ mongodb_security_keyfile_content }}"

# === Users / passwords ===
mongodb_login_database: admin
mongodb_root_admin_name: mongoroot
mongodb_root_admin_password: ""
mongodb_user_admin_name: mongoadm
mongodb_user_admin_password: ""
mongodb_root_backup_name: mongobackup
mongodb_root_backup_password: ""
mongodb_admin_update_password: false
mongodb_users_update_password: false
mongodb_users: []
mongodb_oplog_users: []
mongodb_custom_roles: []

# === mongodb-exporter (pinned) ===
mongodb_exporter_enabled: true
mongodb_exporter_user: "mongodb-exporter"
mongodb_exporter_group: "{{ mongodb_group }}"
mongodb_exporter_name: mongodbexporter
mongodb_exporter_password: ""
mongodb_exporter_version: "0.51.0"
mongodb_exporter_sha256:
  amd64: "01dfae78c737fb48761a715d779cade464a84cce7a2a70357ac4af469bade198"
  arm64: "f2f023d2d632c3b9cdc873558f26a8940efc197c1b36bbf96da17416a60eead6"
mongodb_exporter_link: "https://github.com/percona/mongodb_exporter/releases/download/v{{ mongodb_exporter_version }}/mongodb_exporter-{{ mongodb_exporter_version }}.linux-{{ mongodb_exporter_arch }}.tar.gz"
mongodb_exporter_path: "/usr/local/bin/mongodb-exporter"
mongodb_exporter_temp_dir: "/tmp/mongodb_exporter"

# === Uninstall mode ===
mongodb_uninstall_mode: remove            # remove | purge (purge deletes dbpath)

# === Misc ===
mongodb_manage_service: true
mongodb_force_install: false
mongos_force_install: false
mongodb_package: mongodb-org
mongodb_package_state: present
mongodb_pymongo_pip_version: "4.6.0"
mongodb_reconfigure: false
mongodb_replication_replindexprefetch: all
mongodb_storage_dirperdb: false
mongodb_storage_journal_commitIntervalMs: 100

# === Custom config (escape hatch — extra mongod.conf options) ===
mongodb_config: {}
