---
# === Architecture detection (fails closed via validate.yml) ===
mongodb_supported_architectures: ["x86_64", "aarch64"]
mongodb_apt_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"
mongodb_rpm_arch: "{{ {'x86_64': 'x86_64', 'aarch64': 'aarch64'}[ansible_architecture] }}"
mongodb_exporter_arch: "{{ {'x86_64': 'amd64', 'aarch64': 'arm64'}[ansible_architecture] }}"

# === Support matrix (sourced from docs/SUPPORT-MATRIX.md probe 2026-05-23) ===
# Reflects ACTUAL repo.mongodb.org availability, not aspirational.
mongodb_support_matrix:
  "6.0":
    Debian:    { "12": ["x86_64", "aarch64"] }
    Ubuntu:    { "22.04": ["x86_64", "aarch64"] }
    RedHat:    { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }
    Rocky:     { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }
    AlmaLinux: { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }
  "7.0":
    Debian:    { "12": ["x86_64", "aarch64"] }
    Ubuntu:    { "22.04": ["x86_64", "aarch64"] }
    # NOTE: MongoDB 7.0 has NO Ubuntu 24.04 (noble) repo per probe 2026-05-23.
    RedHat:    { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }
    Rocky:     { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }
    AlmaLinux: { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }
  "8.0":
    Debian:    { "12": ["x86_64", "aarch64"] }
    Ubuntu:    { "22.04": ["x86_64", "aarch64"], "24.04": ["x86_64", "aarch64"] }
    RedHat:    { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }
    Rocky:     { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }
    AlmaLinux: { "8": ["x86_64", "aarch64"], "9": ["x86_64", "aarch64"] }

# === Replicaset group discovery (per §5.1 per-replicaset execution) ===
mongodb_replicaset_groups: >-
  {{
    (groups.keys() | select('match', '^(' ~ mongodb_replication_host_group ~ '|'
                                          ~ mongodb_sharded_host_group ~ '[0-9]+|'
                                          ~ mongodb_config_host_group ~ ')$') | list)
  }}

# === Vault placeholders (kept for v1 compatibility) ===
vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"
vault_url: "{{ lookup('env', 'VAULT_ADDR') }}"
